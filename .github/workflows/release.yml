name: Release

# Builds release artifacts (wheel, sdist, SBOM, SHA-256 sums) and attaches
# them to a GitHub Release with auto-generated notes. Publishing to PyPI uses
# OIDC Trusted Publishing and is DOUBLE-GATED: it only runs when an
# administrator explicitly dispatches this workflow with publish_pypi=true
# AND the protected `pypi` environment passes. It never runs on tag push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Also publish to PyPI via Trusted Publishing (requires the protected `pypi` environment)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-release:
    name: build & attach release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build sdist and wheel (reproducible, timestamps pinned to commit)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          python -m build
      - name: Twine metadata check
        run: python -m twine check dist/*
      - name: Generate SBOM and SHA-256 checksums
        run: python tools/generate_sbom.py dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "LocalGate $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
      - name: Upload artifacts to the workflow run as well
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    needs: build-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true
    runs-on: ubuntu-latest
    # requires the repository to define a protected `pypi` environment and a
    # Trusted Publisher for this workflow on pypi.org; no long-lived token
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing; no password token involved
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Publish via OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
