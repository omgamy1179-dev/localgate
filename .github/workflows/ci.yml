name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install -e .[dev]
      - name: Ruff (style / lint)
        run: python -m ruff check localgate tests main.py
      - name: Mypy (type check)
        run: python -m mypy

  audit:
    name: audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip
      - name: Install project and audit tooling
        run: python -m pip install -e .[dev] pip-audit
      - name: pip-audit (known vulnerabilities in the environment)
        run: python -m pip_audit

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: [lint, audit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"   # scenario names and logs contain non-ASCII
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: python -m pip install -e .[dev]
      - name: Unit tests
        run: python -m pytest tests -p no:cacheprovider
      - name: End-to-end scenario suite
        run: python tests/run_scenarios.py

  coverage-combined:
    name: combined coverage (units + e2e subprocesses)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install -e .[dev]
      - name: Measure combined coverage (unit tests + end-to-end services)
        run: |
          export COVERAGE_PROCESS_START=$PWD/tools/ci-coveragerc.ini
          python -m coverage run --parallel-mode -m pytest tests -p no:cacheprovider
          python tests/run_scenarios.py
          python -m coverage combine
          python -m coverage report
          python -m coverage report --fail-under=85 --format=total >> $GITHUB_STEP_SUMMARY
          python -m coverage xml
      - name: Upload combined coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-combined
          path: coverage.xml

  build:
    name: build & verify package
    needs: coverage-combined
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine metadata check
        run: python -m twine check dist/*
      - name: Clean-install the wheel and verify CLI + MCP handshake
        shell: bash
        run: |
          python -m venv .smoke-venv
          ./.smoke-venv/bin/python -m pip install --quiet dist/*.whl
          ./.smoke-venv/bin/localgate --version
          ./.smoke-venv/bin/localgate --help > /dev/null
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}\n' \
            | ./.smoke-venv/bin/localgate mcp --api http://127.0.0.1:8770
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
