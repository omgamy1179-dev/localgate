[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localgate"
dynamic = ["version"]
description = "Privacy-first local retrieval gateway: index your own notes, PDFs, docx, code, chat exports and images on this machine only; serves them over a loopback HTTP API and a native stdio MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The LocalGate Authors" }]
keywords = [
  "local-rag",
  "mcp-server",
  "ollama",
  "privacy-first",
  "vector-search",
  "agent-tools",
  "local-index",
  "retrieval",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Search",
  "Topic :: Security",
  "Topic :: Text Processing :: Indexing",
]

# the gateway itself runs on the Python standard library alone;
# everything else is an optional accelerator or a development tool
[project.optional-dependencies]
yaml = ["pyyaml>=6"]
pdf = ["pypdf>=6.19.0"]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "coverage>=7",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5",
  "pyyaml>=6",
  "pypdf>=6.19.0",
  "mcp>=1",
]

[project.scripts]
localgate = "localgate.cli:main"

[project.urls]
Homepage = "https://github.com/omgamy1179-dev/localgate"
Changelog = "https://github.com/omgamy1179-dev/localgate/blob/main/CHANGELOG.md"
Security = "https://github.com/omgamy1179-dev/localgate/blob/main/SECURITY.md"

[tool.setuptools]
packages = ["localgate"]

[tool.setuptools.dynamic]
version = { attr = "localgate.__version__" }

[tool.setuptools.package-data]
localgate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["localgate"]

[tool.coverage.report]
show_missing = false
precision = 1
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "logs", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# CSS/JSON/XML template literals in the panel and sample fixtures
"localgate/httpapi.py" = ["E501"]
"tests/make_samples.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["localgate", "tests"]

[tool.mypy]
python_version = "3.10"
files = ["localgate"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
# third-party packages are treated as untyped; LocalGate itself must typecheck
no_site_packages = true
